name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        run: pytest --cov=cupt --cov-report=term-missing --cov-fail-under=80
      - name: Check non-interactive CLI surface
        run: CUPT_INTERACTIVE=0 pytest tests/test_non_interactive_contract.py
      - name: Check translation catalogs
        run: python scripts/check_translations.py
      - name: Check bundled agent skill
        run: python scripts/check_agent_skill.py
      - name: Build distributions
        run: python -m build
